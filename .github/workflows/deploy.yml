name: Deploy to Cloudflare

# Runs the exact same commands documented in the README's "Deploying to
# Cloudflare" section (npm run cf:deploy), just from CI instead of a
# terminal -- so a deploy doesn't depend on anyone having a live
# Codespace/dev environment open.

on:
  push:
    branches: [claude/new-session-hr1y19]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # `initOpenNextCloudflareForDev()` (next.config.ts) only loads
      # .dev.vars into process.env inside the `next dev` server process
      # -- it's a no-op during `next build`. getSupabaseAdminClient()
      # (src/lib/supabase/server.ts) reads process.env directly, and
      # generateStaticParams() on the catalogue pages calls it at build
      # time, so these secrets must be real process env vars for the
      # build step, not just written to .dev.vars.
      - name: Build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          # z.com SMTP mailbox used by the admin's "Reply via Aurielle
          # Email" composer (src/lib/email/send-reply.ts). Optional at
          # deploy time -- until these are set, replying just returns a
          # clear "Email sending is not configured" error instead of a
          # silent failure.
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
          # Not a secret -- ends up in the compiled client bundle
          # either way (NEXT_PUBLIC_*), so it's a literal here rather
          # than a GitHub secret. Used only for metadataBase (OG image
          # / canonical URL resolution) in src/app/layout.tsx.
          NEXT_PUBLIC_SITE_URL: https://auriellefragrancestudio.com
        run: npm run cf:deploy

      # `env:` above only reaches process.env inside the GitHub Actions
      # runner's build -- that's what generateStaticParams() needs at
      # build time, but it does NOT become part of the deployed
      # Worker's own runtime environment. Cloudflare Workers only see
      # `process.env` values that come from real Worker bindings (via
      # `nodejs_compat`): wrangler.jsonc `vars` for plain config, or
      # `wrangler secret put` for anything sensitive. SUPABASE_*/
      # CLOUDINARY_* already work at runtime because those were set as
      # Worker secrets directly (outside of git, at some earlier point
      # -- they're absent from wrangler.jsonc on purpose). This step
      # does the same for SMTP_*, idempotently, on every deploy, so a
      # secret rotated in GitHub actually reaches the live Worker.
      - name: Sync SMTP secrets to the Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
        run: |
          printf '%s' "$SMTP_HOST" | npx wrangler secret put SMTP_HOST
          printf '%s' "$SMTP_PORT" | npx wrangler secret put SMTP_PORT
          printf '%s' "$SMTP_USERNAME" | npx wrangler secret put SMTP_USERNAME
          printf '%s' "$SMTP_PASSWORD" | npx wrangler secret put SMTP_PASSWORD
          printf '%s' "$SMTP_FROM_EMAIL" | npx wrangler secret put SMTP_FROM_EMAIL
          printf '%s' "$SMTP_FROM_NAME" | npx wrangler secret put SMTP_FROM_NAME

  # Separate Worker (email-worker/) that receives inbound mail via
  # Cloudflare Email Routing -- see README "Reply via Aurielle Email:
  # receiving customer replies" for the one-time dashboard setup this
  # depends on (enabling Email Routing for the zone, and pointing a
  # routing rule at this Worker by name). Deployed independently of the
  # main site Worker above since it has its own package.json/
  # node_modules and doesn't go through the OpenNext/Turbopack build.
  deploy-email-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: email-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      # Same reasoning as the main Worker's SMTP secret sync above:
      # these need to be real Worker secrets, not just GitHub Actions
      # build-time env vars, for the deployed email() handler to read
      # them from process.env-equivalent bindings at runtime.
      - name: Sync Supabase secrets to the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          printf '%s' "$SUPABASE_URL" | npx wrangler secret put SUPABASE_URL
          printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
